# Nuestra Estantería — nginx
# Página pública y portadas: las sirve nginx directamente.
# libros.json, resumenes.json, /cuenta y /admin: los genera la aplicación (gunicorn en 127.0.0.1:8000).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/estanteria/public;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location /portadas/ {
        alias /var/lib/estanteria/portadas/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ ^/(libros|resumenes)\.json$ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/estanteria-proxy.conf;
    }

    location /cuenta {
        # Zona de las familias (entrar, «Mi cuenta», pedir libros). Tiene que verse desde fuera.
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/estanteria-proxy.conf;
    }

    location /admin {
        # Opcional pero recomendado: dejar la administración solo para tu red de casa.
        # Quita las almohadillas y ajusta la red:
        # allow 192.168.1.0/24;
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/estanteria-proxy.conf;
    }

    location / {
        try_files $uri =404;
    }
}
